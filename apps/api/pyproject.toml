[project]
name = "locker-pulse-api"
version = "0.1.0"
description = "FastAPI backend for LockerPulse Smart Finder."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.1",
  "litellm>=1.80.0",
  "prisma>=0.15.0",
  "pydantic-settings>=2.12.0",
  "uvicorn[standard]>=0.38.0"
]

[dependency-groups]
dev = [
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0"
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
